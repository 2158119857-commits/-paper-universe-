<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>一页纸的宇宙 · Powers of Ten</title>
<meta name="description" content="从一粒沙到可观测宇宙，14 个尺度，一段连续的缩放旅程。" />
<style>
  :root{
    --ink:#f4efe6;
    --dim:rgba(244,239,230,.55);
    --faint:rgba(244,239,230,.22);
    --line:rgba(244,239,230,.14);
    --accent:#e8c39a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- 舞台 ---------- */
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
  .layer{
    position:absolute;inset:-2%;
    will-change:opacity,transform;
    transform-origin:50% 48%;
    transition:opacity .06s linear;
  }
  .layer svg{width:100%;height:100%;display:block}

  /* 暗角 + 颗粒 */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(120% 100% at 50% 46%, transparent 42%, rgba(0,0,0,.55) 100%),
      radial-gradient(70% 50% at 50% 50%, transparent 60%, rgba(0,0,0,.35) 100%);
  }

  /* ---------- 顶部 ---------- */
  .top{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 34px;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent);
  }
  .brand{font-size:14px;letter-spacing:.34em;color:var(--dim);font-weight:500}
  .brand b{color:var(--ink);font-weight:600;letter-spacing:.28em}
  .hint{font-size:11.5px;letter-spacing:.12em;color:var(--faint)}
  .hint kbd{
    font-family:inherit;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:10.5px;color:var(--dim);
  }

  /* ---------- 底部 HUD ---------- */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:34px 34px 26px;
    display:grid;grid-template-columns:minmax(220px,auto) 1fr auto;
    align-items:end;gap:32px;
    background:linear-gradient(to top,rgba(0,0,0,.78) 10%,rgba(0,0,0,.25) 60%,transparent);
    pointer-events:none;
  }
  .hud > *{pointer-events:auto}

  .meter{display:flex;flex-direction:column;gap:6px;min-width:0}
  .u-num{
    font-family:"SF Mono",ui-monospace,Consolas,"Times New Roman",serif;
    font-size:clamp(24px,3vw,34px);line-height:1;letter-spacing:.02em;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .u-num small{font-size:.5em;color:var(--dim);margin-left:8px;letter-spacing:.06em}
  .stage-name{
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
    font-size:clamp(19px,2.2vw,25px);letter-spacing:.16em;color:var(--accent);
  }

  .fact{
    font-size:13.5px;line-height:1.75;color:var(--dim);
    max-width:44ch;padding-bottom:6px;
    transition:opacity .3s;
  }

  .controls{display:flex;flex-direction:column;gap:12px;width:min(38vw,340px)}
  .ctl-row{display:flex;align-items:center;gap:12px}
  .play{
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    font-size:12px;letter-spacing:.1em;color:var(--dim);
    transition:all .2s;white-space:nowrap;
  }
  .play:hover{color:var(--ink);border-color:rgba(244,239,230,.35)}
  .play.on{background:var(--accent);color:#1a120a;border-color:var(--accent)}

  /* 滑杆 */
  .track-wrap{position:relative;flex:1;display:flex;align-items:center;height:22px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;
    background:transparent;outline:none;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;border-radius:2px;background:rgba(244,239,230,.16);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);margin-top:-5.5px;cursor:grab;
    box-shadow:0 0 0 4px rgba(232,195,154,.14);
    transition:box-shadow .2s;
  }
  input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(232,195,154,.2)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(244,239,230,.16)}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:var(--accent);
  }

  .ticks{position:relative;height:14px;margin-top:2px}
  .tick{
    position:absolute;top:0;width:1px;height:5px;background:rgba(244,239,230,.22);
    transform:translateX(-.5px);cursor:pointer;
  }
  .tick.done{background:rgba(232,195,154,.55)}
  .tick.now{height:9px;background:var(--accent);width:2px}

  @media (max-width:760px){
    .top{padding:18px 20px}
    .hint{display:none}
    .hud{grid-template-columns:1fr;gap:14px;padding:22px 20px 20px}
    .fact{display:none}
    .controls{width:100%}
    .u-num{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    .layer{transition:none}
  }
</style>
</head>
<body>

<div id="stage" aria-label="尺度场景"></div>
<div class="vignette"></div>

<header class="top">
  <div class="brand"><b>一页纸的宇宙</b></div>
  <div class="hint">滚轮 / 拖动滑杆 / <kbd>←</kbd><kbd>→</kbd> 缩放</div>
</header>

<footer class="hud">
  <div class="meter">
    <div class="u-num" id="uNum">10⁻³ 米<small id="uLen">1 毫米</small></div>
    <div class="stage-name" id="stageName">一粒沙</div>
  </div>

  <div class="fact" id="factText">沙粒多半是石英，来自被风化的岩石。</div>

  <div class="controls">
    <div class="ctl-row">
      <button class="play" id="playBtn">自动播放</button>
      <div class="track-wrap">
        <input id="slider" type="range" min="-3" max="26.5" step="0.01" value="-3" aria-label="尺度滑杆" />
      </div>
    </div>
    <div class="ticks" id="ticks"></div>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var W = 1600, H = 1000;
  var MIN_U = -3, MAX_U = 26.5;
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var smooth = function (a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function n(v, d) { return Number(v).toFixed(d === undefined ? 1 : d); }

  /* =========================================================
     场景绘制（每个函数返回 1600×1000 viewBox 内的 SVG 内容）
     ========================================================= */

  function artGrain() {
    var r = mulberry32(101), cx = 800, cy = 470, N = 26, pts = [], i;
    for (i = 0; i < N; i++) {
      var a = i / N * Math.PI * 2, rad = 288 * (0.78 + r() * 0.42);
      pts.push(n(cx + Math.cos(a) * rad * 1.12) + ',' + n(cy + Math.sin(a) * rad * 0.94));
    }
    var poly = pts.join(' ');
    var tex = '', cracks = '', facets = '';
    for (i = 0; i < 260; i++) {
      var ta = r() * Math.PI * 2, tr = Math.sqrt(r()) * 292;
      tex += '<circle cx="' + n(cx + Math.cos(ta) * tr * 1.08) + '" cy="' + n(cy + Math.sin(ta) * tr * 0.9) +
        '" r="' + n(0.5 + r() * 2.3, 1) + '" fill="' + (r() < 0.45 ? '#fff3da' : '#33200f') +
        '" opacity="' + n(0.04 + r() * 0.16, 2) + '"/>';
    }
    for (i = 0; i < 18; i++) {
      var ca = r() * Math.PI * 2, len = 40 + r() * 150;
      var x1 = cx + (r() - 0.5) * 400, y1 = cy + (r() - 0.5) * 330;
      var x2 = x1 + Math.cos(ca + (r() - 0.5) * 0.8) * len;
      var y2 = y1 + Math.sin(ca + (r() - 0.5) * 0.8) * len;
      cracks += '<path d="M' + n(x1, 0) + ' ' + n(y1, 0) + 'Q' + n((x1 + x2) / 2 + 12, 0) + ' ' +
        n((y1 + y2) / 2 - 10, 0) + ' ' + n(x2, 0) + ' ' + n(y2, 0) +
        '" stroke="#301b0c" stroke-width="' + n(0.7 + r() * 1.3, 1) + '" fill="none" opacity="' +
        n(0.08 + r() * 0.16, 2) + '"/>';
    }
    for (i = 0; i < 5; i++) {
      var s1 = Math.floor(r() * N), s2 = Math.floor(r() * N);
      if (s1 === s2) continue;
      var p1 = pts[s1].split(','), p2 = pts[s2].split(',');
      facets += '<polygon points="' + p1[0] + ',' + p1[1] + ' ' + p2[0] + ',' + p2[1] + ' ' +
        cx + ',' + cy + '" fill="' + (r() < 0.5 ? '#000' : '#fff') + '" opacity="' +
        n(0.03 + r() * 0.05, 3) + '"/>';
    }
    return '' +
      '<defs>' +
      '<radialGradient id="g1" cx="33%" cy="27%" r="82%">' +
      '<stop offset="0%" stop-color="#e0bd8c"/><stop offset="38%" stop-color="#b98a56"/>' +
      '<stop offset="72%" stop-color="#8a5c33"/><stop offset="100%" stop-color="#4a2d17"/>' +
      '</radialGradient>' +
      '<clipPath id="c1"><polygon points="' + poly + '"/></clipPath>' +
      '<radialGradient id="sh1"><stop offset="0%" stop-color="#000" stop-opacity=".55"/>' +
      '<stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="v1" cx="50%" cy="46%" r="62%">' +
      '<stop offset="0%" stop-color="#2a1a0d" stop-opacity="0"/>' +
      '<stop offset="100%" stop-color="#0a0503" stop-opacity=".95"/></radialGradient>' +
      '</defs>' +
      '<rect width="1600" height="1000" fill="url(#v1)"/>' +
      '<ellipse cx="800" cy="800" rx="470" ry="120" fill="url(#sh1)"/>' +
      '<polygon points="' + poly + '" fill="url(#g1)"/>' +
      '<g clip-path="url(#c1)">' + facets + tex + cracks +
      '<ellipse cx="690" cy="330" rx="210" ry="120" fill="#ffe9c6" opacity=".07"/>' +
      '<path d="M600 250 Q760 168 930 222" stroke="#ffe6bd" stroke-width="9" fill="none" opacity=".18" stroke-linecap="round"/>' +
      '</g>';
  }

  function artSand() {
    var r = mulberry32(202), out = '', i;
    out += '<defs><radialGradient id="g2" cx="50%" cy="42%" r="70%">' +
      '<stop offset="0%" stop-color="#4a3520"/><stop offset="60%" stop-color="#2b1d10"/>' +
      '<stop offset="100%" stop-color="#0d0805"/></radialGradient>' +
      '<radialGradient id="gl2"><stop offset="0%" stop-color="#fff" stop-opacity=".18"/>' +
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="1600" height="1000" fill="url(#g2)"/>' +
      '<ellipse cx="800" cy="500" rx="760" ry="520" fill="url(#gl2)"/>';
    for (i = 0; i < 340; i++) {
      var x = r() * W, y = r() * H, s = 6 + r() * 26;
      var hue = 26 + r() * 16, sat = 26 + r() * 24, lit = 32 + r() * 34;
      out += '<ellipse cx="' + n(x, 0) + '" cy="' + n(y, 0) + '" rx="' + n(s, 1) + '" ry="' +
        n(s * (0.55 + r() * 0.5), 1) + '" fill="hsl(' + n(hue, 0) + ' ' + n(sat, 0) + '% ' +
        n(lit, 0) + '%)" opacity="' + n(0.35 + r() * 0.55, 2) + '" transform="rotate(' +
        n(r() * 180, 0) + ' ' + n(x, 0) + ' ' + n(y, 0) + ')"/>';
    }
    out += '<circle cx="800" cy="500" r="46" fill="none" stroke="#ffe2b4" stroke-width="1.1" opacity=".55"/>' +
      '<circle cx="800" cy="500" r="78" fill="none" stroke="#ffe2b4" stroke-width=".6" opacity=".2"/>' +
      '<ellipse cx="800" cy="500" rx="13" ry="11" fill="#e9c48e"/>';
    return out;
  }

  function artBeach() {
    var r = mulberry32(303), foam = '', spark = '', i;
    for (i = 0; i < 5; i++) {
      var y = 690 + i * 46, amp = 8 + i * 3;
      foam += '<path d="M0 ' + y + ' Q200 ' + (y - amp) + ' 400 ' + y + ' T800 ' + (y - amp * 0.6) +
        ' T1200 ' + y + ' T1600 ' + (y - amp * 0.4) +
        '" stroke="#fff" stroke-width="' + n(2.6 - i * 0.35, 1) + '" fill="none" opacity="' +
        n(0.42 - i * 0.06, 2) + '"/>';
    }
    for (i = 0; i < 26; i++) {
      spark += '<rect x="' + n(830 + r() * 340, 0) + '" y="' + n(430 + r() * 240, 0) + '" width="' +
        n(8 + r() * 34, 0) + '" height="1.4" fill="#ffe9c4" opacity="' + n(0.1 + r() * 0.35, 2) + '"/>';
    }
    return '' +
      '<defs>' +
      '<linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#f7d9b4"/><stop offset="55%" stop-color="#f2b98a"/>' +
      '<stop offset="100%" stop-color="#e39a72"/></linearGradient>' +
      '<linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#3a7c86"/><stop offset="55%" stop-color="#1e5563"/>' +
      '<stop offset="100%" stop-color="#123c48"/></linearGradient>' +
      '<linearGradient id="sand3" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#e8cba0"/><stop offset="60%" stop-color="#d3ae7c"/>' +
      '<stop offset="100%" stop-color="#a97f52"/></linearGradient>' +
      '<radialGradient id="sun3"><stop offset="0%" stop-color="#fff6e2" stop-opacity=".95"/>' +
      '<stop offset="30%" stop-color="#ffd9a0" stop-opacity=".55"/>' +
      '<stop offset="100%" stop-color="#ffb877" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<rect width="1600" height="460" fill="url(#sky3)"/>' +
      '<circle cx="1010" cy="366" r="230" fill="url(#sun3)"/>' +
      '<circle cx="1010" cy="366" r="26" fill="#fff4dd" opacity=".9"/>' +
      '<rect y="450" width="1600" height="320" fill="url(#sea3)"/>' +
      '<rect y="446" width="1600" height="3" fill="#ffe2bb" opacity=".5"/>' +
      spark +
      '<path d="M0 706 C260 668 520 742 780 700 C1040 660 1320 718 1600 686 L1600 1000 L0 1000 Z" fill="url(#sand3)"/>' +
      foam +
      '<path d="M0 706 C260 668 520 742 780 700 C1040 660 1320 718 1600 686" stroke="#fff" stroke-width="3" fill="none" opacity=".55"/>';
  }

  function artCity() {
    var r = mulberry32(404), roads = '', blocks = '', lights = '', i, j;
    for (i = 0; i <= 14; i++) {
      var x = 120 + i * 104;
      roads += '<line x1="' + x + '" y1="0" x2="' + (x - 70) + '" y2="1000" stroke="#f0b45a" stroke-width="' +
        (i % 4 === 0 ? 2.4 : 1) + '" opacity="' + (i % 4 === 0 ? 0.62 : 0.3) + '"/>';
    }
    for (i = 0; i <= 10; i++) {
      var y = 80 + i * 96;
      roads += '<line x1="0" y1="' + y + '" x2="1600" y2="' + (y - 40) + '" stroke="#f0b45a" stroke-width="' +
        (i % 3 === 0 ? 2 : 0.9) + '" opacity="' + (i % 3 === 0 ? 0.52 : 0.26) + '"/>';
    }
    for (var gi = 0; gi < 14; gi++) {
      for (var gj = 0; gj < 10; gj++) {
        var gx = 120 + gi * 104, gy = 80 + gj * 96;
        var skx = -70 * (gy / 1000), sky = -40 * (gx / 1600);
        var bx = gx + 9 + skx, by = gy + 12 + sky;
        if (bx < 380 + by * 0.18) continue;
        if (r() < 0.12) { /* 留空：广场或水面 */ continue; }
        var bw2 = 70 + r() * 16, bh2 = 60 + r() * 14;
        var isPark = r() < 0.07;
        blocks += '<rect x="' + n(bx, 0) + '" y="' + n(by, 0) + '" width="' + n(bw2, 0) + '" height="' +
          n(bh2, 0) + '" rx="2" fill="' + (isPark ? '#12301f' : (r() < 0.3 ? '#0b141c' : '#152634')) +
          '" opacity="' + n(0.6 + r() * 0.35, 2) + '"/>';
        if (!isPark) {
          var nl = 2 + Math.floor(r() * 6);
          for (var li = 0; li < nl; li++) {
            lights += '<rect x="' + n(bx + 6 + r() * (bw2 - 12), 0) + '" y="' +
              n(by + 6 + r() * (bh2 - 12), 0) + '" width="2" height="2" fill="#ffd9a0" opacity="' +
              n(0.25 + r() * 0.6, 2) + '"/>';
          }
        }
      }
    }
    return '' +
      '<defs>' +
      '<linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#0a1622"/><stop offset="100%" stop-color="#040a10"/></linearGradient>' +
      '<linearGradient id="water4" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="#08131d"/><stop offset="100%" stop-color="#0d2230"/></linearGradient>' +
      '<radialGradient id="glow4" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#f0b45a" stop-opacity=".16"/>' +
      '<stop offset="100%" stop-color="#f0b45a" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<rect width="1600" height="1000" fill="url(#bg4)"/>' +
      '<ellipse cx="820" cy="480" rx="760" ry="560" fill="url(#glow4)"/>' +
      '<path d="M0 0 L360 0 C300 260 250 520 190 760 C160 900 90 1000 0 1000 Z" fill="url(#water4)"/>' +
      roads + blocks + lights +
      '<path d="M360 0 C300 260 250 520 190 760 C160 900 90 1000 0 1000" stroke="#2a6076" stroke-width="2" fill="none" opacity=".5"/>';
  }

  function artContinent() {
    var r = mulberry32(505), clouds = '', cityLights = '', stars = '', i;
    for (i = 0; i < 190; i++) {
      stars += '<circle cx="' + n(r() * 1600, 0) + '" cy="' + n(r() * 430, 0) + '" r="' +
        n(0.4 + r() * 1.1, 2) + '" fill="#fff" opacity="' + n(0.08 + r() * 0.45, 2) + '"/>';
    }
    for (i = 0; i < 24; i++) {
      clouds += '<ellipse cx="' + n(r() * 1600, 0) + '" cy="' + n(320 + r() * 420, 0) + '" rx="' +
        n(40 + r() * 130, 0) + '" ry="' + n(9 + r() * 26, 0) + '" fill="#fff" opacity="' +
        n(0.03 + r() * 0.07, 2) + '" transform="rotate(' + n(-12 + r() * 24, 0) + ' ' +
        n(r() * 1600, 0) + ' ' + n(320 + r() * 420, 0) + ')"/>';
    }
    for (i = 0; i < 160; i++) {
      cityLights += '<circle cx="' + n(120 + r() * 1360, 0) + '" cy="' + n(830 + r() * 160, 0) +
        '" r="' + n(0.7 + r() * 1.4, 1) + '" fill="#ffd9a0" opacity="' + n(0.2 + r() * 0.5, 2) + '"/>';
    }
    return '' +
      '<defs>' +
      '<linearGradient id="space5" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#020509"/><stop offset="100%" stop-color="#061421"/></linearGradient>' +
      '<radialGradient id="ocean5" cx="50%" cy="30%" r="80%">' +
      '<stop offset="0%" stop-color="#1d5f7a"/><stop offset="55%" stop-color="#123f57"/>' +
      '<stop offset="100%" stop-color="#071d2b"/></radialGradient>' +
      '<radialGradient id="atmo5" cx="50%" cy="50%" r="50%">' +
      '<stop offset="70%" stop-color="#7fc6ff" stop-opacity="0"/>' +
      '<stop offset="88%" stop-color="#7fc6ff" stop-opacity=".28"/>' +
      '<stop offset="100%" stop-color="#7fc6ff" stop-opacity="0"/></radialGradient>' +
      '<clipPath id="earth5"><circle cx="800" cy="2450" r="1960"/></clipPath>' +
      '</defs>' +
      '<rect width="1600" height="1000" fill="url(#space5)"/>' +
      stars +
      '<circle cx="800" cy="2450" r="1990" fill="url(#atmo5)"/>' +
      '<circle cx="800" cy="2450" r="1960" fill="url(#ocean5)"/>' +
      '<g clip-path="url(#earth5)">' +
      '<path d="M-60 806 C170 748 330 826 510 786 C690 746 858 812 1036 778 C1214 744 1420 802 1660 766 L1660 1000 L-60 1000 Z" fill="#2c5539"/>' +
      '<path d="M-60 886 C210 842 388 912 612 878 C836 844 1006 902 1240 870 L1240 1000 L-60 1000 Z" fill="#22462f" opacity=".85"/>' +
      '<path d="M-60 806 C170 748 330 826 510 786 C690 746 858 812 1036 778 C1214 744 1420 802 1660 766" stroke="#7fb79a" stroke-width="2" fill="none" opacity=".32"/>' +
      '<path d="M-60 886 C210 842 388 912 612 878 C836 844 1006 902 1240 870" stroke="#6aa184" stroke-width="1.2" fill="none" opacity=".18"/>' +
      cityLights + clouds +
      '</g>' +
      '<circle cx="800" cy="2450" r="1966" fill="none" stroke="#8fd0ff" stroke-width="3" opacity=".2"/>';
  }

  function artEarth() {
    var r = mulberry32(606), clouds = '', i;

  function artGalaxy() {
    var r = mulberry32(1212), dots = '', dust = '', halo = '', i, k;

    }
    for (i = 0; i < 5400; i++) {

      var theta = Math.log(rad / 18) / 0.30;
      var ang = theta + arm * Math.PI + (r() - 0.5) * (0.95 / (1 + t * 6));
      var x = cx + Math.cos(ang) * rad;

        '" opacity="' + n(0.18 + r() * 0.62, 2) + '"/>';
    }
    /* 两条较淡的次级旋臂 */
    for (i = 0; i < 1500; i++) {
      var t3 = Math.pow(r(), 0.62);
      var rad3 = 22 + t3 * 450;

    }
    /* 尘埃带：沿旋臂内侧的暗色轨迹 */

    { u: 7.1, name: '地球', bg: ['#071726', '#01040a'], art: artEarth,
      fact: '刚才那一粒沙，在这颗蓝色星球上，已经找不到了。' },
    { u: 8.6, name: '地月系统', bg: ['#04080f', '#000'], art: artEarthMoon,
      fact: '月球正以每年 3.8 厘米的速度远离我们。' },
    { u: 11.17, name: '内太阳系', bg: ['#03050c', '#000'], art: artSolar,
      fact: '阳光从太阳出发，走到地球需要 8 分 20 秒。' },
    { u: 13.17, name: '太阳系边疆', bg: ['#02040b', '#000'], art: artHeliopause,
      fact: '旅行者一号飞了四十多年，才刚刚摸到这层气泡的边缘。' },
    { u: 16.6, name: '邻近恒星', bg: ['#02040a', '#000'], art: artNearStars,
      fact: '比邻星是最近的邻居，光也要走 4.24 年才能到。' },
    { u: 18.5, name: '本地泡', bg: ['#02030a', '#000'], art: artLocalBubble,
      fact: '太阳系漂在一团被古老超新星吹出的稀薄气泡里。' },
    { u: 21.0, name: '银河系', bg: ['#01020a', '#000'], art: artGalaxy,
      fact: '太阳在猎户臂上，绕银心一圈要 2.3 亿年——上一次经过这里时，恐龙还没出现。' },
    { u: 24.0, name: '宇宙网', bg: ['#010107', '#000'], art: artWeb,
      fact: '星系沿着纤维状结构排列，中间是几乎空无一物的巨大空洞。' },
    { u: 26.5, name: '可观测宇宙', bg: ['#000', '#000'], art: artUniverse,
      fact: '直径约 930 亿光年。再往外，光还没来得及到达我们。' }
  ];

  /* =========================================================
     构建图层
     ========================================================= */
  var stageEl = document.getElementById('stage');
  var layers = STAGES.map(function (s) {
    var d = document.createElement('div');
    d.className = 'layer';
    d.style.background = 'radial-gradient(130% 120% at 50% 44%, ' + s.bg[0] + ', ' + s.bg[1] + ')';
    d.innerHTML = '<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      s.art() + '</svg>';
    stageEl.appendChild(d);
    return d;
  });

  /* =========================================================
     状态与渲染
     ========================================================= */
  var u = MIN_U;
  var activeIndex = 0;
  var slider = document.getElementById('slider');
  var uNum = document.getElementById('uNum');
  var uLen = document.getElementById('uLen');
  var stageName = document.getElementById('stageName');
  var factText = document.getElementById('factText');
  var ticksEl = document.getElementById('ticks');
  var factTimer = null;

  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function sup(v) {
    return String(v).split('').map(function (c) { return SUP[c] || c; }).join('');
  }
  function uLabel(v) {
    var e = Math.floor(v), mant = Math.pow(10, v - e);
    if (mant > 1.05 && Math.abs(e) < 27) {
      return mant.toFixed(1) + ' × 10' + sup(e) + ' 米';
    }
    return '10' + sup(e) + ' 米';
  }
  function lenLabel(v) {
    var m = Math.pow(10, v), km = m / 1000;
    if (m < 0.01) return (m * 1000).toFixed(1) + ' 毫米';
    if (m < 1) return (m * 100).toFixed(0) + ' 厘米';
    if (m < 1000) return m.toFixed(m < 10 ? 1 : 0) + ' 米';
    if (km < 1e4) return km.toFixed(0) + ' 公里';
    if (m < 1e10) return (km / 1e4).toFixed(km < 1e5 ? 1 : 0) + ' 万公里';
    var au = m / 1.496e11, ly = m / 9.461e15;
    if (au < 100) return au.toFixed(au < 10 ? 1 : 0) + ' 天文单位';
    if (ly < 1000) return ly.toFixed(0) + ' 光年';
    if (ly < 1e8) return (ly / 1e4).toFixed(0) + ' 万光年';
    return (ly / 1e8).toFixed(0) + ' 亿光年';
  }

  function render() {
    var best = 0, bestOp = -1, W = 0.4;
    for (var i = 0; i < STAGES.length; i++) {
      var s = STAGES[i];
      var prevMid = i > 0 ? (STAGES[i - 1].u + s.u) / 2 : s.u - 4;
      var nextMid = i < STAGES.length - 1 ? (s.u + STAGES[i + 1].u) / 2 : s.u + 4;
      var o = smooth(prevMid - W, prevMid + W, u) * (1 - smooth(nextMid - W, nextMid + W, u));
      o = clamp(o, 0, 1);
      var sc = clamp(1 - 0.15 * (u - s.u), 0.78, 1.22);
      var el = layers[i];
      if (o < 0.004) {
        if (el.style.visibility !== 'hidden') el.style.visibility = 'hidden';
        continue;
      }
      el.style.visibility = 'visible';
      el.style.opacity = o.toFixed(3);
      el.style.transform = 'scale(' + sc.toFixed(4) + ')';
      if (o > bestOp) { bestOp = o; best = i; }
    }

    if (best !== activeIndex) {
      activeIndex = best;
      stageName.textContent = STAGES[best].name;
      factText.style.opacity = '0';
      if (factTimer) clearTimeout(factTimer);
      var idx = best;
      factTimer = setTimeout(function () {
        factText.textContent = STAGES[idx].fact;
        factText.style.opacity = '1';
      }, 180);
      updateTicks();
    }
    uNum.childNodes[0].nodeValue = uLabel(u);
    uLen.textContent = lenLabel(u);
    slider.value = u;
  }

  function updateTicks() {
    var kids = ticksEl.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = 'tick' + (i < activeIndex ? ' done' : '') + (i === activeIndex ? ' now' : '');
    }
  }

  function setU(v) {
    u = clamp(v, MIN_U, MAX_U);
    render();
  }

  /* 刻度 */
  STAGES.forEach(function (s, i) {
    var t = document.createElement('span');
    t.className = 'tick';
    t.style.left = ((s.u - MIN_U) / (MAX_U - MIN_U) * 100) + '%';
    t.title = s.name;
    t.addEventListener('click', function () { stopPlay(); animateTo(s.u); });
    ticksEl.appendChild(t);
  });

  /* =========================================================
     交互
     ========================================================= */
  var playing = false, rafId = null, playT0 = 0, playFrom = 0, lastTs = 0;
  var playBtn = document.getElementById('playBtn');

  function step(ts) {
    if (!playing) return;
    if (!playT0) { playT0 = ts; playFrom = u; lastTs = ts; }
    /* 卡顿或后台节流后重新锚定，避免画面瞬移 */
    if (ts - lastTs > 2500) playT0 += (ts - lastTs - 16);
    lastTs = ts;
    var nu = playFrom + (ts - playT0) / 1000 * 0.55;
    if (nu >= MAX_U) { setU(MAX_U); stopPlay(); return; }
    setU(nu);
    rafId = requestAnimationFrame(step);
  }
  function startPlay() {
    if (u >= MAX_U) u = MIN_U;
    playing = true; playT0 = 0; lastTs = 0;
    playBtn.classList.add('on');
    playBtn.textContent = '暂停';
    rafId = requestAnimationFrame(step);
  }
  function stopPlay() {
    playing = false;
    playBtn.classList.remove('on');
    playBtn.textContent = u >= MAX_U ? '重播' : '自动播放';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }
  playBtn.addEventListener('click', function () { playing ? stopPlay() : startPlay(); });

  slider.addEventListener('input', function () {
    if (playing) stopPlay();
    setU(parseFloat(slider.value));
  });

  var wheelLock = false;
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (playing) stopPlay();
    var d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    setU(u + d * 0.0016);
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 1.2 : 0.16;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault(); if (playing) stopPlay(); setU(u + step);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault(); if (playing) stopPlay(); setU(u - step);
    } else if (e.key === 'Home') {
      animateTo(MIN_U);
    } else if (e.key === 'End') {
      animateTo(MAX_U);
    } else if (e.key === ' ') {
      e.preventDefault(); playing ? stopPlay() : startPlay();
    }
  });

  function animateTo(target) {
    var from = u, dist = target - from, dur = Math.min(1800, 420 + Math.abs(dist) * 46);
    var t0 = null;
    if (rafId) cancelAnimationFrame(rafId);
    function tick(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      setU(from + dist * e);
      if (p < 1) rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  /* 触摸/拖动 */
  var dragY = null;
  stageEl.addEventListener('pointerdown', function (e) {
    dragY = e.clientY;
    stageEl.setPointerCapture(e.pointerId);
    if (playing) stopPlay();
  });
  stageEl.addEventListener('pointermove', function (e) {
    if (dragY === null) return;
    var dy = dragY - e.clientY;
    dragY = e.clientY;
    setU(u + dy * 0.012);
  });
  stageEl.addEventListener('pointerup', function () { dragY = null; });
  stageEl.addEventListener('pointercancel', function () { dragY = null; });

  /* 初始 */
  render();
  updateTicks();
  playBtn.textContent = '自动播放';
})();
</script>
</body>
</html>
